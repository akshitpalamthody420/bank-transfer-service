spring:
  application:
    name: bank-transfer-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bank}
    username: ${DB_USER:bank}
    password: ${DB_PASSWORD:bank}
    hikari:
      connection-init-sql: "SET lock_timeout = '5s'"
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
